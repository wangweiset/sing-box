name: Detect sing-box iOS build entry

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "sing-box 的 tag / branch / commit，例如 v1.11.0"
        required: true
        default: "v1.11.0"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout sing-box source
        uses: actions/checkout@v5
        with:
          repository: SagerNet/sing-box
          ref: ${{ inputs.upstream_ref }}
          path: sing-box
          fetch-depth: 1
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: sing-box/go.mod
          cache: true
          cache-dependency-path: sing-box/go.sum

      - name: Show environment info
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          go version

      - name: Detect build entry
        working-directory: sing-box
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== PWD ====="
          pwd

          echo "===== ROOT FILES ====="
          ls -la

          echo "===== TOP TREE ====="
          find . -maxdepth 3 | sort | sed -n '1,400p'

          echo "===== BUILD RELATED FILES ====="
          find . -maxdepth 5 \
            \( -name 'Makefile' -o -name '*.mk' -o -name '*.sh' -o -name '*.go' -o -name '*.yml' -o -name '*.yaml' \) \
            | sort | sed -n '1,400p'

          echo "===== MAKEFILE PREVIEW ====="
          if [ -f Makefile ]; then
            sed -n '1,260p' Makefile
          else
            echo "No Makefile found in repo root"
          fi

          echo "===== ALL MAKE TARGETS ====="
          if [ -f Makefile ]; then
            make -qp 2>/dev/null | \
              grep -E '^[A-Za-z0-9_.-]+:' | \
              cut -d: -f1 | \
              sort -u | sed -n '1,400p'
          else
            echo "No Makefile found"
          fi

          echo "===== BUILD KEYWORD SEARCH ====="
          grep -RniE 'ios-framework|ios_framework|xcframework|gomobile|libbox|framework|mobile|darwin|apple|build ios|build_ios' . \
            --include='Makefile' \
            --include='*.mk' \
            --include='*.sh' \
            --include='*.go' \
            --include='*.yml' \
            --include='*.yaml' | sed -n '1,400p' || true

          echo "===== POSSIBLE APPLE/IOS FILES ====="
          find . -maxdepth 6 | grep -Ei 'ios|apple|darwin|mobile|libbox|framework|release|script|build' | sed -n '1,400p' || true
